<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WHODUNIT VOICE 海报</title>
<link rel="stylesheet" href="poster.css">
</head>
<body>
  <div class="poster">

    <!-- 顶部：品牌行 -->
    <div class="brand">🔍 WHODUNIT VOICE · 语音互动探案</div>

    <!-- 主标题 -->
    <h1 class="title"><span class="q">「</span>开口，就能破案。<span class="q">」</span></h1>

    <!-- 副标题 -->
    <p class="subtitle">五名嫌疑人，一个真凶。他们坐在你对面——<br>开口问，或者永远不知道答案。</p>

    <!-- 玩法三步 -->
    <div class="steps">
      <div class="step">
        <div class="step-icon">🎙️</div>
        <div class="step-label">开口</div>
        <div class="step-desc">审问 AI 扮演的嫌疑人</div>
      </div>
      <div class="step">
        <div class="step-icon">🔍</div>
        <div class="step-label">细听</div>
        <div class="step-desc">一句话漏掉一条线索</div>
      </div>
      <div class="step">
        <div class="step-icon">⚖️</div>
        <div class="step-label">指控</div>
        <div class="step-desc">带着证据，当庭指认</div>
      </div>
    </div>

    <!-- 案件行 -->
    <div class="cases">
      <div class="cases-head">两起案件 · 两种语言</div>
      <div class="cases-list">THE STERLING AFFAIR <span class="sep">·</span> 玉簪案</div>
    </div>

    <!-- 特性行 -->
    <div class="features">AI 实时扮演 · 语音识别朗读 · 即开即玩</div>

    <!-- CTA -->
    <div class="cta">现在就开口，真相在等你</div>

  </div>
</body>
</html>
